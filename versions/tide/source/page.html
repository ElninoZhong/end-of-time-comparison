<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><link rel="icon" href="data:,"><title>时间的尽头 · 终潮观测站</title>
<style>

ding:0 13px;font-size:11px}.hud{position:fixed;right:4.5vw;bottom:114px;display:flex;gap:6px}.hud button{border-radius:24px;font-size:11px;border:1px solid #e1d6b63a;padding:8px 12px;background:#0a1423ab}.hud button[aria-pressed=true]{color:var(--gold);border-color:#e1d6b68a}
main{position:fixed;top:40.5%;left:7.2vw;width:min(480px,54vw);pointer-events:none;text-shadow:0 2px 26px #03071380}.eyebrow{display:flex;align-items:center;gap:11px;color:var(--gold);font-size:10px;letter-spacing:.18em}.eyebrow::before{content:"";width:27px;height:1px;background:var(--gold)}h1{margin:18px 0 2px;font:500 clamp(48px,5.7vw,94px)/1.16 var(--serif);letter-spacing:.035em;white-space:nowrap}.english{font:italic 400 clamp(21px,2.4vw,36px)/1.2 Baskerville,Georgia,serif;color:#ded6c9;letter-spacing:.02em}.verse{font:400 14px/1.95 var(--serif);letter-spacing:.12em;color:#d2d3d0;margin:22px 0 25px;white-space:pre-line}.action{pointer-events:auto;gap:23px;width:fit-content;border:1px solid #f2d9ad80;border-radius:2px;background:#201c1a77;backdrop-filter:blur(9px);padding:11px 16px;font-size:12px;letter-spacing:.15em;color:#fff1dc}.action:hover{background:#745c3b85;border-color:#f5d9b0}.action svg{color:var(--gold)}footer{bottom:max(24px,env(safe-area-inset-bottom));padding-top:15px;border-top:1px solid #c3d0d133;gap:18px;pointer-events:none}footer button{pointer-events:auto}.footmark{gap:13px}.instrument{font-size:10px;letter-spacing:.08em;color:var(--gold)}.footmark span+span{font-size:11px;letter-spacing:.1em;color:#d0d2cf}.nav{gap:18px}.nav button{display:flex;align-items:center;gap:9px;font-size:11px;color:#b7c0c1;letter-spacing:.08em;padding:6px 0}.nav small{font-size:9px}.nav button:before{content:"";width:5px;height:5px;border:1px solid #9aa9ac;transform:rotate(45deg)}.nav button.active{color:#f5dbad}.nav button.active:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 9px #e9cc9988}.nav button.done small:after{content:"✓"}.coord{font-size:10px;letter-spacing:.1em;color:#b8c1c1}.target{position:fixed;top:0;left:0;display:flex;align-items:center;gap:9px;white-space:nowrap;padding:10px;transform:translate(-22px,-50%);font-size:11px;color:#ffe2ad;text-shadow:0 1px 5px #000}.target i{display:block;width:22px;height:22px;border:1px solid #ffe0a0;transform:rotate(45deg);box-shadow:0 0 15px #ffcda56b,inset 0 0 8px #ffcda56b}.target span{background:#071019b8;padding:4px 8px;border-radius:1px}.hint{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);font-size:11px;color:#f4e8d0;letter-spacing:.08em;text-align:center;pointer-events:none;background:#08131ac4;padding:7px 12px;border-radius:30px}.hint:empty{display:none}[hidden]{display:none!important}.clean header,.clean footer,.clean main,.clean .target,.clean .hud,.clean .shade,.clean .hint{opacity:0;visibility:hidden}.restore{position:fixed;right:20px;top:20px;font-size:12px}.chapter h1{font-size:clamp(40px,4.7vw,74px)}.chapter .english{font-size:24px}.chapter .verse{max-width:330px}.panel{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:5}.sheet{position:relative;width:min(420px,90vw);padding:32px;background:#0a141def;border:1px solid #d6c29666;box-shadow:0 20px 100px #0008}.sheet h2{font:28px var(--serif);margin:0 0 25px}.sheet p{line-height:1.8;font-size:14px;color:#d4d5d0}.sheet dl{display:grid;grid-template-columns:1fr auto;row-gap:13px;font-size:13px}.sheet dd{color:var(--gold);margin:0}.sheet button{margin-top:18px}.err{position:fixed;inset:0;z-index:10;display:grid;place-content:center;padding:10%;background:#0c1720;font-size:16px;line-height:1.9}
@media(max-width:760px){header{top:19px}.tools{gap:4px}.tools button{min-width:31px;height:31px;padding:0 6px}.brand{gap:7px}.brand strong{font-size:13px}.brand small{font-size:7px}.mark{width:29px}.tools #sound{padding:0 8px}.coord{display:none}main{top:auto;bottom:16.7%;left:6vw;width:87vw}h1{font-size:clamp(44px,10vw,68px);margin-top:11px}.english{font-size:23px}.verse{font-size:13px;margin:13px 0 15px}.hud{bottom:73px;right:5vw}.hud button{padding:6px 9px}.shade{background:linear-gradient(0deg,#050b13ed,rgba(4,10,16,.38) 34%,transparent 60%)}footer{bottom:18px;padding-top:10px}.nav{gap:11px}.footmark span+span{display:none}.hint{bottom:109px;width:max-content;max-width:90vw}.chapter .verse{max-width:78vw}.chapter h1{font-size:38px}main.chapter{bottom:14.1%}.target span{font-size:10px}}
@media(max-height:560px) and (min-aspect-ratio:1/1){main{top:26%;bottom:auto}.verse{margin:8px 0}.eyebrow{font-size:9px}h1,.chapter h1{font-size:45px}.english,.chapter .english{font-size:20px}header{top:12px}footer{bottom:10px}.hud{bottom:62px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body><canvas id="sea" tabindex="0" aria-label="终潮海面，拖动环视，滚轮缩放，方向键旋转"></canvas><div class="shade"></div>
<header><div class="brand"><svg class="mark" viewBox="0 0 44 44" fill="none" stroke="currentColor"><circle cx="22" cy="22" r="12"/><ellipse cx="22" cy="22" rx="21" ry="5.6" transform="rotate(-28 22 22)"/><path d="M22 3v7m0 24v7"/><circle cx="35" cy="11" r="1.6" fill="currentColor"/></svg><div><strong>终潮观测站</strong><small>LAST TIDE OBSERVATORY</small></div></div><div class="tools"><button id="sound" aria-label="开启声音" aria-pressed="false"><svg class="icon" viewBox="0 0 20 20"><path d="M2 8h3l4-4v12l-4-4H2z"/><path id="wave" d="m13 8 4 4m0-4-4 4"/></svg><span>声音</span></button><button id="clean" title="纯净画面 (H)" aria-label="纯净画面"><svg class="icon" viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m6 0h4v-4"/></svg></button><button id="help" aria-label="操作指南" title="操作指南">?</button></div></header>
<main id="story"><div class="eyebrow" id="tag">终潮航行日志</div><h1 id="title">时间的尽头</h1><div class="english" id="en" lang="en">The End of Time</div><p class="verse" id="verse">最后一颗恒星沉入潮汐。<br>海上，只剩三段尚未消散的回声。</p><button id="action" class="action"><span>驶入余晖</span><svg class="icon" viewBox="0 0 20 20"><path d="M2 10h15m-5-5 5 5-5 5"/></svg></button></main>
<button class="target" id="target" hidden><i></i><span>拾取残响</span></button>
<div class="hud" id="hud" hidden><button id="reverse" aria-pressed="false">↶ 倒流</button><button id="pause" aria-pressed="false">Ⅱ 凝时</button></div>
<div class="hint" id="hint" role="status"></div>
<footer><div class="footmark"><span class="instrument" id="clock">T + 00:00</span><span>观测时刻</span></div><nav class="nav" aria-label="航行章节"><button data-i="0" class="active"><small>01</small>余晖</button><button data-i="1"><small>02</small>逆流</button><button data-i="2"><small>03</small>初光</button></nav><span class="coord">拖动环视 · 滚轮靠近</span></footer>
<button class="mini restore" id="restore" hidden>恢复界面</button>
<div class="panel" id="panel" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt"><h2 id="pt">观测手册</h2><p>沿航线访问三座信标，点亮每座信标旁的菱形标记，收回海面留下的三段残响。</p><dl><dt>绕行 / 靠近</dt><dd>拖动 / 滚轮或双指</dd><dt>键盘环视 / 缩放</dt><dd>方向键 / ＋ −</dd><dt>凝住时间 / 倒流</dt><dd>空格 / R</dd><dt>纯净画面 / 复位视角</dt><dd>H / Home</dd></dl><button class="action" id="close">继续观测</button></section></div><div id="err" class="err" hidden></div>
<script>/*BUNDLE*/</script></body></html>
